name: Deploy ChatMirror Cloud frontend

on:
  push:
    branches: [main]
    paths:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatmirror-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy frontend assets to chatmirror-cloud
        env:
          CLOUDFLARE_ACCOUNT_ID: 06fbeda6d29ef178a59fd2321d8c10d4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-chatmirror-cloud.mjs
